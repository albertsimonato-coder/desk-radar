- name: UniCredit
  priority: 1
  group: bank
  ats: sitemap
  config:
    sitemap_url: none
    index_url_pattern: "https://careers.unicredit.eu/en_GB/jobsuche/SearchJobs/?jobRecordsPerPage=15&jobOffset={offset}"
    index_step: 15
    index_max_pages: 45
    job_url_pattern: "careers\\.unicredit\\.eu/en_GB/jobsuche/JobDetail/"
    index_item_regex: 'href="(?P<url>https://careers\.unicredit\.eu/en_GB/jobsuche/JobDetail/[^"]+)">[^<]*</a>.*?job-info-icon_world"> ?(?P<location>[^<]*?) ?</span>(?:.*?job-info-icon_function"> ?(?P<department>[^<]*?) ?</span>)?(?:.*?job-info-icon_work"> ?(?P<employment_type>[^<]*?) ?</span>)?'
    index_item_split: '<h3 class=\"article__header__text__title'
    max_new_pages: 150
  careers_url: https://careers.unicredit.eu/en_GB/jobsuche
  active: true
  notes: Avature portal; paginated listing walked by offset, JSON-LD on job pages (no location there, so country/function come from the listing). ~560 openings group-wide, backfilled 150 per run.

