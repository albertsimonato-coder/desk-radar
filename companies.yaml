# Desk Radar employer registry.
# priority: 1 = scanned daily, 2 = scanned on Mondays (or always with --all)
# group:    bank | boutique | asset_manager | commodities | exchange | prop_trading | advisory | corporate
# ats:      greenhouse | lever | smartrecruiters | ashby | workday | sitemap | manual
# active:   false = known ATS but adapter not built yet, or site blocked. See docs/inventory.md.

