[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-radar"
version = "0.1.0"
description = "Desk Radar Scanner: daily monitor of finance job openings from employer career sites"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "selectolax>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/radar/render.py" = ["E501"]   # embedded HTML/JS template
