# Desk Radar profile: who you are and what counts as a good fit.
# All classification keywords and score weights live here so you can tune without code changes.

new_window_days: 7          # "new" = first_seen within this many days and status = open

# Scope: postings outside this are not stored at all (they never reach the database or the
# pages). Rows stored before a scope change are not deleted; being "unseen" they close after two
# runs like any withdrawn posting. Set `enabled: false` to store everything again.
scope:
  enabled: true
  countries: [GB, IT, LU, CH, FR, IE]
  keep_unknown_country: true      # location could not be parsed -> keep, better safe than sorry
  exclude_functions: [technology, operations]
  exclude_employment_types: [experienced, internship]   # summer/spring/placement internships are for bachelor students; off-cycle stays

# Morning digest (python -m radar digest): top openings new since the last run, by fit score.
digest:
  max_items: 25
  min_fit: 40

cities:
  # city -> weight (0..1). Cities not listed get `other_city_weight`.
  London: 1.0
  Milan: 1.0
  Luxembourg: 0.9
  Zurich: 0.9
  Geneva: 0.9
  Paris: 0.85
  Dublin: 0.85
other_city_weight: 0.15
unknown_city_weight: 0.4    # location could not be parsed (keep visible, do not punish too hard)
remote_weight: 0.5

countries_bonus:            # small bonus if city unknown but country matches
  GB: 0.6
  IT: 0.6
  LU: 0.55
  CH: 0.55
  FR: 0.5
  IE: 0.5

employment_types:           # weight 0..1
  graduate: 1.0
  internship: 0.1           # excluded by scope anyway
  offcycle: 1.0
  analyst_junior: 0.9
  experienced: 0.25
  other: 0.5

functions:                  # weight 0..1
  sales_trading: 1.0
  commodities: 1.0
  market_making: 0.95
  quant: 0.85
  market_risk: 0.9
  treasury: 0.9
  ibd: 0.7
  advisory_valuation: 0.7
  asset_management: 0.5
  operations: 0.3
  technology: 0.2
  other: 0.35

weights:                    # how much each component contributes to the 0-100 score (sum ~ 100)
  city: 25
  employment_type: 25
  function: 25
  keywords: 10
  recency: 15               # applying early matters: a posting loses half of this every 14 days

recency_half_life_days: 14  # recency component decays with posted_at (or first_seen if missing)

# Free-text keywords that boost the score when found in title/department/snippet. Case-insensitive.
keywords_boost:
  - 2027
  - graduate programme
  - graduate program
  - off-cycle
  - off cycle
  - physical trading
  - oil trading
  - metals
  - freight
  - agricultural
  - energy trading
  - power trading
  - gas trading
  - market risk
  - treasury
  - alm
  - liquidity
  - market making
  - market-making
  - trading desk
  - sales and trading
  - sales & trading
  - global markets
  - fixed income
  - fx
  - rates
  - commodities
  - italian
  - italiano
keywords_penalty:
  - senior
  - director
  - vice president
  - managing director
  - head of
  - lead
  - principal
  - "10+ years"
  - "8+ years"
  - "7+ years"
  - "5+ years"
  - apprentice
