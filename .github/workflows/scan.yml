name: scan

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      tier:
        description: "daily (priority 1, plus priority 2 on Mondays) or all"
        default: "daily"
        type: choice
        options: [daily, all]
      email:
        description: "auto = only when something is new since the last run; always = send a test digest"
        default: "auto"
        type: choice
        options: [auto, always]

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (fixtures only, no network)
        run: pytest -q

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar run --tier "${{ github.event.inputs.tier || 'daily' }}"

      - name: Commit results
        run: |
          git config user.name "desk-radar[bot]"
          git config user.email "desk-radar@users.noreply.github.com"
          git add data/radar.sqlite docs/index.html docs/new.html
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Someone may have pushed during the scan: replay our commit on top of theirs,
            # keeping our (newer) database and pages if both sides touched them.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "push attempt $attempt failed, retrying"; sleep 10
            done
          fi

      - name: Build morning digest
        id: digest
        run: |
          set +e
          python -m radar digest --html digest.html --text digest.txt --subject digest.subject --markdown digest.md ${{ github.event.inputs.email == 'always' && '--always' || '' }}
          code=$?
          set -e
          if [ "$code" = "0" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; else echo "send=false" >> "$GITHUB_OUTPUT"; fi
          echo "subject=$(cat digest.subject 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Post the digest as a GitHub issue (GitHub emails it to you)
        if: steps.digest.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # close yesterday's digest issue(s) so only the latest stays open
          for n in $(gh issue list --label digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by today's digest." >/dev/null
          done
          gh label create digest --color 0B57D0 --description "Daily Desk Radar digest" 2>/dev/null || true
          gh issue create --title "${{ steps.digest.outputs.subject }}" --label digest --body-file digest.md

      - name: Email the digest
        if: steps.digest.outputs.send == 'true' && env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.digest.outputs.subject }}
          to: albert.simonato@gmail.com
          from: Desk Radar <${{ secrets.MAIL_USERNAME }}>
          html_body: file://digest.html
          body: file://digest.txt
